name: Feature request
description: 提一个功能或算法改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 请描述使用场景，而不是只给一个方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 这个建议不依赖新增的收费 API、账号或不明来源模型
          required: false
