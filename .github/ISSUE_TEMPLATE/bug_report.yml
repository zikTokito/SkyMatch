name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删掉日志、截图和配置中的真实位置、账号名、Steam 凭据。
  - type: input
    id: version
    attributes:
      label: SkyMatch version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows / Wallpaper Engine
      placeholder: "Windows 11 23H2 / Wallpaper Engine 2.6"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开...\n2. 点击...\n3. 看到..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 已脱敏的日志片段或截图
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已移除真实位置、账号名、Steam 凭据和其他个人信息
          required: true
        - label: 我使用的是最新 Release 或当前 main 构建
          required: true
